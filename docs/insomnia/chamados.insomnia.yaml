    meta:
      id: fld_health
    children:
      - name: "Home"
        meta:
          id: req_health_home
        method: GET
        url: "{{base_url}}/"
        description: "Verifica se a API está no ar."
        body: {}
        parameters: []
        headers: []
        authentication: {}
        scripts:
          afterResponse: |
            insomnia.test('status 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });
        pathParameters: null

