        url: "{{base_url}}/department/{{department_id}}"
        description: "Atualiza o setor 1 com os dados atuais do seed."
        body:
          mimeType: application/json
          text: |
            {
              "name": "Tecnologia da Informação",
              "abbreviation": "COTIC"
            }
        parameters: []
        headers: []
        authentication: {}
        scripts:
          afterResponse: |
            insomnia.test('status 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
