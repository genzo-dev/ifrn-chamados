        meta:
          id: req_department_create
        method: POST
        url: "{{base_url}}/department"
        description: "Cria um setor e salva o ID em created_department_id."
        body:
          mimeType: application/json
          text: |
            {
              "name": "Setor Insomnia",
              "abbreviation": "INSOM"
            }
        parameters: []
        headers: []
        authentication: {}
        scripts:
          afterResponse: |
            insomnia.test('status 201', () => {
              insomnia.expect(insomnia.response.code).to.eql(201);
            });

            if (insomnia.response.code === 201) {
              const body = insomnia.response.json();
              insomnia.environment.set('created_department_id', body.id);
            }
        pathParameters: null
      - name: "Listar setores"
        meta:
          id: req_department_list
        method: GET
        url: "{{base_url}}/department"
        description: "Lista setores paginados. O filtro nome fica desativado por padrão."
        body: {}
        parameters:
          - name: nome
            value: "COTIC"
            disabled: true
          - name: page
            value: "{{page}}"
          - name: size
            value: "{{size}}"
          - name: sort
            value: "{{sort_name}}"
        headers: []
        authentication: {}
        scripts:
          afterResponse: |
            insomnia.test('status 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });
        pathParameters: null
      - name: "Buscar setor"
